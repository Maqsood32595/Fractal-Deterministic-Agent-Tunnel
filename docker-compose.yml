services:
  target-api:
    build: ./target-api
    container_name: fractal-target-api
    ports:
      - "8080:8080"
    environment:
      - INSTANCE_CLASS=db.t3.medium
      - MAX_CONNECTIONS=100
      - mem_limit=256m
    volumes:
      - ./target-api:/app
      - /app/node_modules
    restart: unless-stopped

  localstack:
    image: localstack/localstack:3.4.0
    container_name: fractal-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,rds,cloudwatch,ssm
      - DEBUG=0
    restart: unless-stopped

  gitea:
    image: gitea/gitea:latest
    container_name: fractal-gitea
    ports:
      - "3006:3000"
      - "2222:22"
    environment:
      - GITEA__database__DB_TYPE=sqlite3
    volumes:
      - gitea-data:/data
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: fractal-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=1h'
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fractal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  gitea-data:
  qdrant-data:
